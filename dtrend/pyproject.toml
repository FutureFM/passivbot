[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dtrend"
version = "0.1.0"
description = "D-TREND: multi-leg (TS momentum, XS momentum, XS carry) vol-targeted crypto perp portfolio on Nautilus Trader with Binance data"
requires-python = ">=3.12"
dependencies = [
    "nautilus_trader>=1.231",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "requests>=2.31",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dtrend = "dtrend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
